[package]
name = "spaces-messaging"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "sqlite", "sso-login"] }
mime_guess = "2"
base64 = "0.22"
eyeball = "0.8"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
matrix-sdk-crypto = "=0.18.0"
tempfile = "3"
rand = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
